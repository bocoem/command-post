name = "beacon-gate"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Optional: users table layer URL without https://. Empty = layer 0 of SERVICES.users.
USERS_TABLE = ""
# Optional: change log table layer URL without https://. Empty = layer 1 of SERVICES.users (EM Ops → App Access → Upgrade creates it).
USERLOG_TABLE = ""
# ArcGIS services the apps may use, as JSON (paste from EM Ops -> Setup -> "Command Board & MCI apps" -> Copy gate settings).
SERVICES = ""

# ArcGIS OAuth 2.0 app credentials item "BEACON gate (Command Board and MCI apps)" (its Client ID is not secret).
ARC_CLIENT_ID = ""
ARC_PORTAL = "https://botetourt.maps.arcgis.com"

# Secrets (Cloudflare dashboard → the worker → Settings → Variables and Secrets → Add → type Secret):
#   ARC_CLIENT_SECRET  the Client Secret from that ArcGIS item
